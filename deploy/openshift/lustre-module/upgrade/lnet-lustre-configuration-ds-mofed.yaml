---
# Target-kernel LNet DS for a canary OpenShift upgrade (MOFED / o2ib).
# Apply *alongside* the live DS, not instead of it. See README.md.
#
# metadata.name is the target OpenShift minor (DNS label), e.g.
# lnet-configuration-4.22.1. Do not put uname -r in the name (dots).
#
# This DS configures LNet then loads ptlrpc/lustre/mgc (modprobe -d /opt),
# so the image tag must match the *target* uname -r with the -mofed suffix.
#
# Selectors are AND: kernel pin, lnet.ready, ko2iblnd.ready, and
# NVIDIA MOFED ready (mofed.wait=false). No worker-canary exclude:
# canary nodes must run this DS.
#
# Clone of ../lnet-lustre-configuration-ds-mofed.yaml.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lnet-configuration-4.22.1
spec:
  selector:
    matchLabels:
      name: lnet-configuration-4.22.1
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        name: lnet-configuration-4.22.1
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
        feature.node.kubernetes.io/kernel-version.full: "5.14.0-687.17.1.el9_8.x86_64"
        kmm.node.kubernetes.io/openshift-kmm.lnet.ready: ""
        kmm.node.kubernetes.io/openshift-kmm.ko2iblnd.ready: ""
        network.nvidia.com/operator.mofed.wait: "false"
      hostNetwork: true
      # hostNetwork uses the node's resolv.conf; without this,
      # kubernetes.default.svc does not resolve.
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
      serviceAccount: kmm-operator-module-loader
      serviceAccountName: kmm-operator-module-loader
      initContainers:
      - name: configure-lnet
        image: &lustre-image "image-registry.openshift-image-registry.svc:5000/openshift-kmm/lustre-client-moduleloader:5.14.0-687.17.1.el9_8.x86_64-mofed"
        command:
          - /bin/sh
          - -c
          - |
            set -e

            echo "=== Waiting for LNet kernel modules (loaded by KMM Modules lnet, ko2iblnd) ==="
            REQUIRED_MODULES="libcfs lnet ko2iblnd"
            MAX_WAIT=300
            WAITED=0
            ALL_LOADED=false
            while [ "$WAITED" -lt "$MAX_WAIT" ]; do
              ALL_LOADED=true
              MISSING=""
              for module in $REQUIRED_MODULES; do
                if ! lsmod | grep -q "^${module} "; then
                  ALL_LOADED=false
                  MISSING="$MISSING $module"
                fi
              done
              if [ "$ALL_LOADED" = "true" ]; then
                echo "INFO: All required modules loaded"
                break
              fi
              echo "Waiting for modules:$MISSING (${WAITED}/${MAX_WAIT}s)"
              sleep 2
              WAITED=$((WAITED + 2))
            done
            if [ "$ALL_LOADED" != "true" ]; then
              echo "ERROR: Required modules not loaded after ${MAX_WAIT}s:$MISSING"
              exit 1
            fi

            echo "Verifying libcfs configuration (set by KMM):"
            echo "  cpu_npartitions: $(cat /sys/module/libcfs/parameters/cpu_npartitions 2>/dev/null || echo 'N/A')"
            echo "  cpu_pattern: $(cat /sys/module/libcfs/parameters/cpu_pattern 2>/dev/null || echo 'N/A')"

            echo "Configuring LNet: net=${NET_TYPE}, iface=${NET_IFACE}"
            echo "Initializing LNet..."
            if ! lnetctl lnet configure 2>/dev/null; then
              if lnetctl net show 2>/dev/null | grep -q "net type"; then
                echo "LNet already configured (continuing)"
              else
                echo "ERROR: Failed to configure LNet"
                exit 1
              fi
            fi

            IFS=',' read -ra IFACES <<< "${NET_IFACE}"
            IFACE_LIST=""
            for i in "${!IFACES[@]}"; do
              IFACE_LIST="${IFACE_LIST}              $i: ${IFACES[$i]}\n"
            done

            cat >/tmp/lnet.yaml <<EOF
            net:
              - net type: ${NET_TYPE}
                local NI(s):
                  - interfaces:
            $(echo -e "${IFACE_LIST}")
                    tunables:
                      peer_timeout: ${LNET_PEER_TIMEOUT}
                      peer_credits: ${LNET_PEER_CREDITS}
                      peer_buffer_credits: ${LNET_PEER_BUFFER_CREDITS}
                      credits: ${LNET_CREDITS}
                    lnd tunables:
                      peercredits_hiw: ${LNET_PEERCREDITS_HIW}
                      map_on_demand: ${LNET_MAP_ON_DEMAND}
                      concurrent_sends: ${LNET_CONCURRENT_SENDS}
                      fmr_pool_size: ${LNET_FMR_POOL_SIZE}
                      fmr_flush_trigger: ${LNET_FMR_FLUSH_TRIGGER}
                      fmr_cache: ${LNET_FMR_CACHE}
                      ntx: ${LNET_NTX}
                      conns_per_peer: ${LNET_CONNS_PER_PEER}
            EOF

            echo "=== Generated LNet Configuration ==="
            cat /tmp/lnet.yaml
            echo "=== Importing Configuration ==="
            IMPORT_OK=true
            if ! lnetctl import < /tmp/lnet.yaml; then
              IMPORT_OK=false
              echo "WARN: lnetctl import failed (often EEXIST if net already present)"
            fi

            echo "=== LNet Status ==="
            lnetctl net show -v
            if ! lnetctl net show | grep -q "net type: ${NET_TYPE}"; then
              echo "ERROR: LNet net ${NET_TYPE} not present after configuration"
              exit 1
            fi

            MISSING_IFACES=""
            for IFACE in "${IFACES[@]}"; do
              IFACE="${IFACE// /}"
              if ! lnetctl net show | grep -A30 "net type: ${NET_TYPE}" | grep -q "${IFACE}"; then
                MISSING_IFACES="${MISSING_IFACES} ${IFACE}"
              fi
            done
            if [ -n "${MISSING_IFACES}" ]; then
              echo "WARN: LNet net ${NET_TYPE} is missing interfaces:${MISSING_IFACES}"
              if lsmod | grep -qE '^(ptlrpc|lustre|mgc) '; then
                echo "ERROR: cannot reconfigure LNet; ptlrpc/lustre already loaded"
                exit 1
              fi
              echo "INFO: deleting net ${NET_TYPE} and re-importing"
              lnetctl net del --net "${NET_TYPE}" || true
              if ! lnetctl import < /tmp/lnet.yaml; then
                echo "ERROR: lnetctl import failed after net del"
                exit 1
              fi
              lnetctl net show -v
              for IFACE in "${IFACES[@]}"; do
                IFACE="${IFACE// /}"
                if ! lnetctl net show | grep -A30 "net type: ${NET_TYPE}" | grep -q "${IFACE}"; then
                  echo "ERROR: interface ${IFACE} still missing after re-import"
                  exit 1
                fi
              done
            elif [ "${IMPORT_OK}" = "false" ]; then
              echo "INFO: existing LNet net ${NET_TYPE} already has interfaces ${NET_IFACE}"
            fi
            echo "=== LNet configuration complete ==="

            echo "=== Loading Lustre client modules from /opt ==="
            KERNEL_VERSION=$(uname -r)
            if [ ! -d "/opt/lib/modules/${KERNEL_VERSION}" ]; then
              echo "ERROR: this image has no modules for kernel ${KERNEL_VERSION}"
              echo "ERROR: DS image tag must equal uname -r (KMM moduleloader tag)"
              ls -d /opt/lib/modules/* 2>/dev/null || echo "ERROR: /opt/lib/modules is empty"
              exit 1
            fi
            # ptlrpc is a dependency of lustre; do not modprobe it by name.
            for module in lustre mgc; do
              if lsmod | grep -q "^${module} "; then
                echo "INFO: ${module} already loaded"
                continue
              fi
              if ! modprobe -d /opt "${module}"; then
                echo "ERROR: modprobe -d /opt ${module} failed"
                find /opt/lib/modules/${KERNEL_VERSION} -name "${module}.ko*" || true
                exit 1
              fi
              echo "INFO: ${module} loaded"
            done
            lsmod | grep -E "ptlrpc|lustre|mgc"
            echo "=== Lustre modules loaded ==="
        env:
          - name: NET_TYPE
            value: "o2ib"
          - name: NET_IFACE
            value: "ibs1f1"
          - name: LNET_PEER_TIMEOUT
            value: "180"
          - name: LNET_PEER_CREDITS
            value: "32"
          - name: LNET_PEER_BUFFER_CREDITS
            value: "0"
          - name: LNET_CREDITS
            value: "256"
          - name: LNET_PEERCREDITS_HIW
            value: "16"
          - name: LNET_MAP_ON_DEMAND
            value: "1"
          - name: LNET_CONCURRENT_SENDS
            value: "64"
          - name: LNET_FMR_POOL_SIZE
            value: "512"
          - name: LNET_FMR_FLUSH_TRIGGER
            value: "384"
          - name: LNET_FMR_CACHE
            value: "1"
          - name: LNET_NTX
            value: "512"
          - name: LNET_CONNS_PER_PEER
            value: "1"
        securityContext:
          allowPrivilegeEscalation: true
          privileged: true
          runAsUser: 0
          seLinuxOptions:
            type: spc_t
      containers:
      - name: lnet-configuration
        image: *lustre-image
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            trap "sleep 10" TERM
            while true; do sleep 5; done
        lifecycle:
          preStop:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  echo "Unmounting Lustre filesystems"
                  lustre_rmmod
        securityContext:
          allowPrivilegeEscalation: true
          privileged: true
          runAsUser: 0
          seLinuxOptions:
            type: spc_t
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File

