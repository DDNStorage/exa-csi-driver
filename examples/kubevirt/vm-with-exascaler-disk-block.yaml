apiVersion: v1
kind: Namespace
metadata:
  name: vm-space
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ddn-fs-small-block
provisioner: exa.csi.ddn.com
allowVolumeExpansion: true
parameters:
  exaFS: 172.25.80.50@tcp:172.25.80.51@tcp:172.25.80.52@tcp:172.25.80.53@tcp:/sfa18k03/vm
  mountPoint: /exaFS
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  labels:
    capk.cluster.x-k8s.io/kubevirt-machine-name: vm-kubevirt-ubuntu-24-small-block
    capk.cluster.x-k8s.io/kubevirt-machine-namespace: vm-space
    kubevirt.io/vm: vm-kubevirt-ubuntu-24-small-block
    name: vm-kubevirt-ubuntu-24-small-block
  name: vm-kubevirt-ubuntu-24-small-block
  namespace: vm-space  
spec:
  dataVolumeTemplates:
  - metadata:
      name: vm-kubevirt-ubuntu-24-dv-small-block
      namespace: vm-space
      annotations:
        cdi.kubevirt.io/storage.bind.immediate.requested: "true"
    spec:
      pvc:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: ddn-fs-small-block
        volumeMode: Block
      source:
        http:
          url: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
  runStrategy: Manual
  template:    
    spec:
      domain:
        cpu:
          cores: 4
          model: host-passthrough
          sockets: 1
          threads: 1
        devices:
          autoattachGraphicsDevice: false
          autoattachMemBalloon: false
          autoattachSerialConsole: true
          blockMultiQueue: true
          disks:
          - disk:
              bus: virtio
            name: rootdisk
            bootOrder: 1
          - disk:
              bus: virtio
            name: cloudinitdisk
            bootOrder: 2
          interfaces:
          - bridge: {}
            name: default
            ports:
            - name: ssh
              port: 22
              protocol: TCP
          rng: {}
        firmware:
          bootloader:
            efi:
              secureBoot: false
        ioThreadsPolicy: shared
        machine:
          type: virt
        memory:
          guest: 8Gi
        resources:
          limits:
            cpu: "8"
            ephemeral-storage: 5Gi
            memory: 12Gi
          requests:
            cpu: "3"
            memory: 10Gi
      evictionStrategy: External
      networks:
      - name: default
        pod: {}
      volumes:
      - name: rootdisk
        dataVolume:
          name: vm-kubevirt-ubuntu-24-dv-small-block
      - cloudInitConfigDrive:
          userData: |
            #cloud-config
            users:
              - name: ubuntu
                sudo: ALL=(ALL) NOPASSWD:ALL
                shell: /bin/bash
                passwd: "$6$ud79cjYHUNLFvtI6$DEDpdCYPtm34DpviBfYdMqCqyqewUrfkju/dJrf22Sqkl5/TZXWyaPOuQdUdm66CTVpLi8y5e8b1KS5wlsNM6."
                lock_passwd: false
            ssh_pwauth: true
        name: cloudinitdisk